# Sổ lưu bút Docker: nginx -> web (Flask) -> redis
# Chạy:  docker compose up -d --build     Mở:  http://localhost:8080
# Dừng:  docker compose down              Xóa cả dữ liệu:  docker compose down -v

name: guestbook          # tiền tố tên container / network / volume

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"      # cổng duy nhất mở ra ngoài; đổi trong file .env
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy   # đợi web khỏe rồi mới chạy nginx
    networks: [frontend]
    restart: unless-stopped

  web:
    build: ./app
    image: guestbook-web:1.0
    environment:
      REDIS_HOST: redis              # gọi redis bằng tên service
      APP_TITLE: ${APP_TITLE:-Sổ lưu bút Docker}
    depends_on:
      redis:
        condition: service_healthy   # đợi redis sẵn sàng
    networks: [frontend, backend]
    restart: unless-stopped
    # Không có "ports:" -> web không thể truy cập trực tiếp từ ngoài, chỉ đi qua nginx.
    develop:                         # dùng với: docker compose watch
      watch:
        - action: sync+restart
          path: ./app/app.py
          target: /app/app.py
        - action: rebuild
          path: ./app/requirements.txt

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # ghi log thao tác ra đĩa để không mất dữ liệu
    volumes:
      - redis_data:/data             # named volume: dữ liệu còn sau khi container bị xóa
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    restart: unless-stopped
    # Cũng không có "ports:" -> chỉ container trong network "backend" mới gọi được redis.

networks:
  frontend:      # nginx <-> web
  backend:       # web <-> redis   (nginx không nằm trong network này nên không với tới redis)

volumes:
  redis_data:
