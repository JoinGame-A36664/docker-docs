# Cấu hình nginx cho phần giao diện. Nginx làm HAI việc:
#   1) Phát các file giao diện (HTML, CSS, JS) cho trình duyệt.
#   2) Là "lễ tân": mọi yêu cầu bắt đầu bằng /api/ được chuyển vào dịch vụ "api".
# Cú pháp: mỗi dòng kết thúc bằng dấu chấm phẩy ;  các khối nằm trong { }.

server {
    listen 80;
    server_name _;

    # Thư mục chứa giao diện bên trong image.
    root /usr/share/nginx/html;
    index index.html;

    # Một vài tiêu đề bảo vệ cơ bản gửi kèm mọi trang.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Địa chỉ "dò tên" của Docker (luôn là 127.0.0.11 trong mạng Docker).
    # Có dòng này, nginx tra lại địa chỉ của "api" mỗi 10 giây, nên khi container api được tạo lại
    # (đổi địa chỉ IP), nginx không bị "lạc" và không phải khởi động lại.
    resolver 127.0.0.11 valid=10s;

    # /api/... -> chuyển vào dịch vụ api, cổng 8000.
    location /api/ {
        # Đưa địa chỉ vào một biến để nginx chịu tra tên lại nhiều lần (xem dòng resolver ở trên).
        set $api_dich http://api:8000;
        proxy_pass $api_dich;

        # Chuyển thông tin gốc của khách (tên miền, địa chỉ IP) cho api.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Đường dành riêng để Docker kiểm tra nginx còn sống. Không ghi vào nhật ký cho đỡ rối.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Mọi đường dẫn còn lại: tìm file giao diện tương ứng, không có thì báo 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
