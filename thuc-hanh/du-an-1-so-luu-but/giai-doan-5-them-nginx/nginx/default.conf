# File cấu hình của nginx (nginx dùng cú pháp riêng, không phải YAML).
# Mỗi dòng kết thúc bằng dấu chấm phẩy ;  Các khối nằm trong dấu ngoặc nhọn { }.

# "server" = một trang web mà nginx phục vụ.
server {
    # Lắng nghe ở cổng 80 (cổng bên trong container nginx).
    listen 80;

    # Nhận mọi tên miền (ở bài này ta chỉ truy cập bằng localhost).
    server_name _;

    # "location /" = áp dụng cho mọi đường dẫn bắt đầu bằng "/" (tức là tất cả).
    location / {
        # Chuyển yêu cầu vào dịch vụ "web", cổng 8000.
        # "web" là TÊN dịch vụ trong compose.yaml. Docker tự đổi tên này thành địa chỉ đúng.
        proxy_pass http://web:8000;

        # Các dòng dưới đây chuyển thông tin gốc của khách (tên miền, địa chỉ IP...) cho web,
        # vì nếu không web sẽ chỉ nhìn thấy "nginx" gọi vào chứ không biết khách thật là ai.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
